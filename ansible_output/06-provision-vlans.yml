---
# Provision VLANs from group_vars/all.yml:
#   vlans:
#     - { vlan_id: 10, name: USERS }
- name: Provision VLANs
  hosts: switches
  gather_facts: no
  tasks:
    - name: Ensure VLANs exist
      cisco.ios.ios_vlans:
        config:
          - vlan_id: "{{ item.vlan_id }}"
            name: "{{ item.name }}"
        state: merged
      loop: "{{ vlans | default([]) }}"
      loop_control:
        label: "VLAN {{ item.vlan_id }} {{ item.name }}"
