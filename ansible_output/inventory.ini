# EveBridge generated inventory
# Fill in each host's ansible_host with its management-network IP
# (attach the nodes to a cloud / pnet0 bridge first). Delete hosts you
# don't want Ansible touching.

[routers]

[switches]
R1 ansible_host=CHANGEME # EVE node id 1
R10 ansible_host=CHANGEME # EVE node id 10
R11 ansible_host=CHANGEME # EVE node id 11
R12 ansible_host=CHANGEME # EVE node id 12
R13 ansible_host=CHANGEME # EVE node id 13
R14 ansible_host=CHANGEME # EVE node id 14
R15 ansible_host=CHANGEME # EVE node id 15
R16 ansible_host=CHANGEME # EVE node id 16
R17 ansible_host=CHANGEME # EVE node id 17
R18 ansible_host=CHANGEME # EVE node id 18
R2 ansible_host=CHANGEME # EVE node id 2
R3 ansible_host=CHANGEME # EVE node id 3
R7 ansible_host=CHANGEME # EVE node id 7
R8 ansible_host=CHANGEME # EVE node id 8
R9 ansible_host=CHANGEME # EVE node id 9

[firewalls]

[linux_vms]

[all:vars]
ansible_connection=network_cli
ansible_network_os=cisco.ios.ios
# For Linux VMs override per host: ansible_connection=ssh ansible_network_os=*
ansible_user=admin
ansible_become=yes
ansible_become_method=enable
